[build]
  command = "echo 'Netlify build'"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# ---------------------------------------------------------------------------
# Proxy all /api/* requests to the Render Python backend.
# Replace RENDER_URL below with your Render service URL after first deploy,
# e.g. https://ai-chatbot-backend.onrender.com
# ---------------------------------------------------------------------------
[[redirects]]
  from   = "/api/*"
  to     = "https://ai-chatbot-glhr.onrender.com/:splat"
  status = 200
  force  = true
