name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      # Netlify CLI does not auto-install Python dependencies.
      # We manually install packages into each function's directory so
      # the CLI bundles them into a self-contained ZIP for Lambda.
      - name: Bundle Python functions with their dependencies
        run: |
          set -e

          # chatbot only needs API-call packages (no DB / numpy)
          mkdir -p .functions_bundled/chatbot
          cp netlify/functions/chatbot.py .functions_bundled/chatbot/
          pip install fastapi mangum pydantic requests \
            --target .functions_bundled/chatbot/ --quiet

          # upload_pdf needs the full stack (no numpy — pure-Python cosine sim)
          mkdir -p .functions_bundled/upload_pdf
          cp netlify/functions/upload_pdf.py .functions_bundled/upload_pdf/
          pip install fastapi mangum pydantic sqlmodel pg8000 pypdf requests \
            --target .functions_bundled/upload_pdf/ --quiet

          # rag_query needs the full stack (no pypdf, no numpy)
          mkdir -p .functions_bundled/rag_query
          cp netlify/functions/rag_query.py .functions_bundled/rag_query/
          pip install fastapi mangum pydantic sqlmodel pg8000 requests \
            --target .functions_bundled/rag_query/ --quiet

          # Exclude the bundled dirs from the static-file deploy
          echo ".functions_bundled/" >> .netlifyignore

      - name: Unlock Netlify locked deploy (if any)
        run: |
          SITE=$(curl -sf -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" || echo '{}')
          LOCKED_ID=$(echo "$SITE" | python3 -c "
import json,sys
d=json.load(sys.stdin)
pub=d.get('published_deploy') or {}
if pub.get('locked'): print(pub.get('id',''))
" 2>/dev/null || echo '')
          if [ -n "$LOCKED_ID" ]; then
            echo "Unlocking deploy $LOCKED_ID..."
            curl -s -X POST "https://api.netlify.com/api/v1/deploys/$LOCKED_ID/unlock" \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              -H "Content-Type: application/json"
            echo "Unlocked."
          else
            echo "No locked deploy to unlock."
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 8ee6f2d8-fff5-482e-9505-d16ce6ba304f

      - name: Deploy to Netlify
        run: netlify deploy --prod --functions=.functions_bundled
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 8ee6f2d8-fff5-482e-9505-d16ce6ba304f
