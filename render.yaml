# Render deployment configuration
# https://render.com/docs/render-yaml-reference
#
# Deploy steps:
#   1. Push this repo to GitHub (already done)
#   2. Go to https://dashboard.render.com/ → New → Web Service
#   3. Connect the Haroonkhan0629/AI-Chatbot repository
#   4. Render will detect this file automatically
#   5. Set the required environment variables in the Render dashboard:
#        GROQ_API_KEY         — from https://console.groq.com/keys
#        DATABASE_URL         — postgresql+pg8000://... (Neon / Supabase)
#        HUGGINGFACE_API_KEY  — from https://huggingface.co/settings/tokens

services:
  - type: web
    name: ai-chatbot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
    # Free instance — note: spins down after 15 min inactivity (cold start ~30 s)
    plan: free
